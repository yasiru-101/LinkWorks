# Shared dependency catalog owned by E; feature packages declare their direct imports.
# Runtime packages cover Firebase models, state, images, formatting and local storage.
# Generation tools rebuild common/lib/src/models from models.dart.

name: linkworks_common
description: Shared LinkWorks code owned by common.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.13.2
resolution: workspace
dependencies:
  cached_network_image: ^4.0.0
  cloud_firestore: ^6.9.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.1.1
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  timeago: ^3.7.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1

