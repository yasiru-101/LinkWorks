# Explains: Give Gradle its configured JVM memory/error-reporting options during builds.
# Keep enough memory available for Flutter/Dart while Gradle compiles Android plugins on this machine.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
# Limit parallel Android work so Gradle and Flutter can coexist within the available system memory.
org.gradle.workers.max=2
# Explains: Use AndroidX support libraries required by modern Flutter plugins.
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
# Explains: Configure this Android/Gradle build property; change it only with the corresponding toolchain setting.
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
# Explains: Configure this Android/Gradle build property; change it only with the corresponding toolchain setting.
android.builtInKotlin=false

# Compile plugin Kotlin sources without incremental caches because the shared Pub cache
# and this workspace are on different Windows drive roots.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
